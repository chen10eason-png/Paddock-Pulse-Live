<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Paddock Pulse Live PoC</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;background:#07090e;color:#f5f7fa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#242a36 0,#0c1018 38%,#07090e 70%);min-height:100vh}.app{max-width:720px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px 80px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;letter-spacing:-.04em;font-size:24px}.live{background:#e10600;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:900}.live.demo{background:#343a46}.hero{margin:22px 0 14px;padding:20px;border:1px solid #ffffff18;border-radius:24px;background:#ffffff0a;backdrop-filter:blur(24px)}.hero h1{margin:0;font-size:29px}.muted{color:#9ca6b5}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.pill{padding:7px 10px;border-radius:999px;background:#ffffff0d;font-size:12px}.flag{color:#ffd43b}.table{overflow:hidden;border-radius:24px;border:1px solid #ffffff14;background:#0d1119}.row{display:grid;grid-template-columns:35px 55px 1fr 78px 72px;gap:8px;align-items:center;padding:13px 12px;border-bottom:1px solid #ffffff0d}.row:last-child{border-bottom:0}.pos{font-size:18px;font-weight:800}.tla{font-weight:900}.team{font-size:11px;color:#8993a2;margin-top:2px}.gap{text-align:right;font-variant-numeric:tabular-nums}.tyre{text-align:right;font-size:11px}.pit{color:#ffd43b;font-weight:800}.section{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:#8993a2;margin:22px 4px 10px}.rc{padding:14px 15px;border-radius:18px;background:#ffffff0a;margin-bottom:8px;font-size:13px}.rc strong{display:block;color:#ffd43b;margin-bottom:4px}.foot{margin-top:18px;font-size:12px;color:#697384;line-height:1.5}@media(max-width:430px){.row{grid-template-columns:30px 48px 1fr 68px 58px;padding:12px 9px}.hero h1{font-size:25px}}
</style></head><body><main class="app"><div class="top"><div class="brand">Paddock Pulse</div><div id="badge" class="live demo">DEMO</div></div><section class="hero"><div class="muted" id="meeting">Live Race PoC</div><h1 id="lap">等待賽事資料</h1><div class="meta"><span class="pill flag" id="track">TRACK —</span><span class="pill" id="weather">Weather —</span><span class="pill" id="updated">—</span></div></section><div class="section">Live classification</div><section class="table" id="table"></section><div class="section">Race control</div><section id="rc"></section><div class="foot">PoC V0.1 · 無付費 OpenF1。沒有進行中的 F1 session 時自動顯示 DEMO 資料；正式 session 時由後端 SignalR feed 更新。</div></main>
<script>
const q=new URLSearchParams(location.search), forceDemo=q.get('demo')==='1';
const esc=x=>String(x??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function render(d){
 const b=document.querySelector('#badge');b.textContent=d.live?'● LIVE':'DEMO';b.className='live'+(d.live?'':' demo');
 document.querySelector('#meeting').textContent=d.session?.Meeting?.Name||d.session?.Name||'F1 Live';
 const lc=d.lap||{};document.querySelector('#lap').textContent=`Lap ${lc.CurrentLap??'—'} / ${lc.TotalLaps??'—'}`;
 const tr=d.track||{};document.querySelector('#track').textContent=tr.Message||tr.Status||'TRACK —';
 const w=d.weather||{};document.querySelector('#weather').textContent=`Air ${w.AirTemp??'—'}° · Track ${w.TrackTemp??'—'}° · Rain ${w.Rainfall??'—'}`;
 document.querySelector('#updated').textContent=d.live?'即時更新':'介面測試';
 document.querySelector('#table').innerHTML=(d.drivers||[]).map(x=>`<div class="row"><div class="pos">${esc(x.position)}</div><div><div class="tla">${esc(x.tla)}</div><div class="team">#${esc(x.number)}</div></div><div><div>${esc(x.team)}</div><div class="team">${x.inPit?'<span class="pit">PIT</span>':`Stops ${esc(x.pitStops??'—')}`}</div></div><div class="gap">${esc(x.gap||x.interval||'—')}</div><div class="tyre">${esc(x.compound||'—')}<br>${x.tyreLaps!=null?esc(x.tyreLaps)+' LAPS':''}</div></div>`).join('');
 document.querySelector('#rc').innerHTML=(d.raceControl||[]).slice(0,6).map(x=>`<div class="rc"><strong>${esc(x.Flag||x.Category||'RACE CONTROL')}</strong>${esc(x.Message||'')}</div>`).join('')||'<div class="rc">目前沒有 Race Control 訊息</div>';
}
async function tick(){try{const r=await fetch('/api/live'+(forceDemo?'?demo=1':''),{cache:'no-store'});render(await r.json())}catch(e){document.querySelector('#updated').textContent='連線失敗'}setTimeout(tick,2000)}tick();
</script></body></html>
