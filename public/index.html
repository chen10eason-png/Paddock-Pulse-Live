<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080a0f"><title>Paddock Pulse Live</title>
<style>
:root{color-scheme:dark;--panel:#11151d;--muted:#8c95a6;--line:#242a35;--text:#f5f7fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -15%,#1b2330 0,#0b0e14 38%,#080a0f 66%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;padding:env(safe-area-inset-top) 12px calc(24px + env(safe-area-inset-bottom))}.wrap{max-width:780px;margin:auto}.top{display:flex;justify-content:space-between;align-items:flex-start;padding:18px 4px 10px}.brand{font-weight:900;font-size:24px}.sub{font-size:12px;color:var(--muted);margin-top:3px}.badge{padding:7px 10px;border-radius:999px;font-size:12px;font-weight:850;background:#202631;color:#d9dee8}.badge.live{background:#421518;color:#ff817a}.badge.result{background:#172737;color:#a7d8ff}.badge.offline,.badge.waiting{background:#28292e;color:#aaa}.mode{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:4px 0 12px;background:#0d1118;border:1px solid var(--line);padding:4px;border-radius:14px}.mode button{border:0;font:inherit;padding:9px;border-radius:10px;background:transparent;color:#8f98a8;font-size:12px;font-weight:850}.mode button.active{background:#252b36;color:#fff}.historyPanel{display:none;margin-bottom:12px}.historyPanel.show{display:block}.selects{display:grid;grid-template-columns:1fr 1fr;gap:8px}.selects select{width:100%;background:#11151d;color:#fff;border:1px solid #242a35;border-radius:12px;padding:10px;font:inherit;font-size:12px}.hero{background:linear-gradient(180deg,rgba(24,30,41,.96),rgba(15,19,26,.96));border:1px solid #252b37;border-radius:23px;padding:18px}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.12em;color:#7d8797;margin-bottom:5px}.event{font-size:22px;font-weight:900}.meta{margin-top:5px;color:var(--muted);font-size:13px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.metric,.tiny{background:#0c1016;border:1px solid #202631;border-radius:16px;padding:13px}.metric b{display:block;font-size:20px;margin-top:4px}.label{font-size:10px;color:var(--muted);letter-spacing:.1em;font-weight:800}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.tiny{padding:10px;border-radius:14px}.tiny b{font-size:14px;display:block;margin-top:4px}.section{margin-top:18px}.sectionHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}.section h2{font-size:14px;margin:0;color:#c9cfda}.segmented{display:flex;padding:3px;background:#11151d;border:1px solid #242a35;border-radius:11px}.segmented button{border:0;background:transparent;color:#7f8999;padding:5px 10px;border-radius:8px;font-size:11px;font-weight:800}.segmented button.active{background:#252b36;color:#fff}.drivers,.rc{display:flex;flex-direction:column;gap:7px}.driver{position:relative;display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;background:#11151d;border:1px solid var(--line);border-radius:15px;padding:11px 12px 11px 15px;overflow:hidden}.driver:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--team,#777)}.driver.retired{opacity:.56}.pos{font-weight:950;font-size:18px}.name{font-weight:850}.team,.detail{font-size:11px;color:var(--muted);margin-top:3px}.right{text-align:right}.gap{font-weight:820;font-size:13px}.pill{display:inline-flex;border-radius:7px;padding:2px 5px;font-size:9px;font-weight:900;margin-left:5px}.dnf{background:#3a2224;color:#ff9a94}.fast{background:#321a42;color:#d9a0ff}.msg{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 12px}.footer{margin:18px 0 4px;text-align:center;color:#697284;font-size:11px}.empty{padding:22px;text-align:center;color:var(--muted);background:var(--panel);border-radius:16px;border:1px solid var(--line)}@media(max-width:520px){.grid{grid-template-columns:repeat(2,1fr)}.metrics{grid-template-columns:1fr 1fr}.metric.clock{grid-column:1/-1}.driver{grid-template-columns:30px 1fr auto}.selects{grid-template-columns:1fr}}
</style></head><body><main class="wrap">
<div class="top"><div><div class="brand">Paddock Pulse Live</div><div class="sub">Live + Results Archive · V0.6</div></div><div id="status" class="badge">LOADING</div></div>
<div class="mode"><button id="latestBtn" class="active">最新狀態</button><button id="historyBtn">歷史結果</button></div>
<div id="historyPanel" class="historyPanel"><div class="selects"><select id="meetingSel"><option>載入賽事…</option></select><select id="sessionSel"><option>選擇 Session</option></select></div></div>
<section class="hero"><div id="eyebrow" class="eyebrow">LOADING</div><div id="event" class="event">等待資料…</div><div id="meta" class="meta">正在取得最新 session</div><div class="metrics"><div class="metric"><span class="label">LAP</span><b id="lap">—</b></div><div class="metric"><span class="label">TRACK</span><b id="track">—</b></div><div class="metric clock"><span class="label">SESSION CLOCK</span><b id="clock">—</b></div></div><div class="grid"><div class="tiny"><span class="label">AIR</span><b id="air">—</b></div><div class="tiny"><span class="label">TRACK TEMP</span><b id="ttrack">—</b></div><div class="tiny"><span class="label">HUMIDITY</span><b id="hum">—</b></div><div class="tiny"><span class="label">WIND</span><b id="wind">—</b></div></div></section>
<section class="section"><div class="sectionHead"><h2>Timing Tower</h2><div class="segmented" id="gapToggle"><button data-mode="gap" class="active">GAP</button><button data-mode="interval">INTERVAL</button></div></div><div id="drivers" class="drivers"><div class="empty">等待資料…</div></div></section>
<section class="section"><div class="sectionHead"><h2>Race Control</h2></div><div id="rc" class="rc"><div class="empty">目前沒有訊息</div></div></section><div id="updated" class="footer">—</div></main>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));let latest=null,gapMode='gap',meetings=[];
function badge(s){s=String(s||'RESULT').toUpperCase();$('status').textContent=s;$('status').className='badge '+s.toLowerCase()}
function lapSeconds(s){if(!s)return Infinity;const p=String(s).split(':');return p.length===2?Number(p[0])*60+Number(p[1]):Number(s)||Infinity}
function fastestNumber(ds){let b=null,t=Infinity;for(const d of ds||[]){const x=lapSeconds(d.bestLap);if(x<t){t=x;b=d.number}}return b}
function render(d){latest=d;badge(d.status);$('eyebrow').textContent=d.source==='archive'?'LATEST / ARCHIVE RESULT':'LIVE TIMING';const m=d.session?.Meeting||{};$('event').textContent=m.Name||'F1 Session';$('meta').textContent=[m.Location,d.session?.Name,d.sessionStatus||d.session?.SessionStatus].filter(Boolean).join(' · ');$('lap').textContent=(d.lap?.CurrentLap||'—')+' / '+(d.lap?.TotalLaps||'—');$('track').textContent=d.track?.Message||d.track?.Status||'—';$('clock').textContent=d.clock?.Remaining||'—';$('air').textContent=d.weather?.AirTemp?d.weather.AirTemp+'°C':'—';$('ttrack').textContent=d.weather?.TrackTemp?d.weather.TrackTemp+'°C':'—';$('hum').textContent=d.weather?.Humidity?d.weather.Humidity+'%':'—';$('wind').textContent=d.weather?.WindSpeed?d.weather.WindSpeed+' m/s':'—';const ds=d.drivers||[],fast=fastestNumber(ds);$('drivers').innerHTML=ds.map(x=>{const v=gapMode==='interval'?(x.position===1?'LEADER':x.interval||'—'):(x.position===1?'LEADER':x.gap||'—');const f=String(x.number)===String(fast)&&x.bestLap?'<span class="pill fast">FASTEST</span>':'';const state=x.retired?'<span class="pill dnf">DNF</span>':'';return `<div class="driver ${x.retired?'retired':''}" style="--team:#${esc(x.teamColour||'777777')}"><div class="pos">${esc(x.position)}</div><div><div class="name">${esc(x.tla||x.name||x.number)} #${esc(x.number)}${state}${f}</div><div class="team">${esc(x.team)} · ${esc(x.compound||'—')} ${x.tyreLaps!=null?esc(x.tyreLaps)+'L':''}${x.pitStops!=null?' · '+esc(x.pitStops)+' STOP':''}</div></div><div class="right"><div class="gap">${esc(v)}</div><div class="detail">${x.lastLap?'LAST '+esc(x.lastLap):'LAST —'}${x.bestLap?' · BEST '+esc(x.bestLap):''}</div></div></div>`}).join('')||'<div class="empty">目前沒有車手資料</div>';$('rc').innerHTML=(d.raceControl||[]).slice(0,14).map(x=>`<div class="msg"><strong>${esc(x.Flag||x.Category||'Race Control')}${x.Lap?' · LAP '+esc(x.Lap):''}</strong><div class="detail">${esc(x.Message||'')}</div></div>`).join('')||'<div class="empty">目前沒有 Race Control 訊息</div>';$('updated').textContent=d.source==='archive'?'資料來源：F1 Live Timing Archive':'最後 Live Timing 更新：'+(d.lastTimingAt?new Date(d.lastTimingAt).toLocaleString('zh-TW'):'—')}
async function j(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error(await r.text());return r.json()}
async function loadLatest(){try{const live=await j('/api/live');if(live.status==='LIVE'){render(live);return}render(await j('/api/archive/latest'))}catch(e){try{render(await j('/api/live'))}catch(_){badge('OFFLINE');$('meta').textContent='無法取得 Live 或 Archive 資料'}}}
async function loadMeetings(){const d=await j('/api/archive/meetings');meetings=d.meetings||[];$('meetingSel').innerHTML=meetings.map((m,i)=>`<option value="${i}">${esc(m.Name)}</option>`).join('');if(meetings.length){$('meetingSel').value=String(meetings.length-1);fillSessions()}}
function fillSessions(){const m=meetings[Number($('meetingSel').value)];$('sessionSel').innerHTML=(m?.Sessions||[]).map((s,i)=>`<option value="${i}">${esc(s.Name||s.Type)}</option>`).join('');if(m?.Sessions?.length){$('sessionSel').value=String(m.Sessions.length-1);loadSelected()}}
async function loadSelected(){const m=meetings[Number($('meetingSel').value)],s=m?.Sessions?.[Number($('sessionSel').value)];if(!s)return;badge('LOADING');render(await j('/api/archive/session?path='+encodeURIComponent(s.Path)))}
$('latestBtn').onclick=()=>{$('latestBtn').classList.add('active');$('historyBtn').classList.remove('active');$('historyPanel').classList.remove('show');loadLatest()};$('historyBtn').onclick=async()=>{$('historyBtn').classList.add('active');$('latestBtn').classList.remove('active');$('historyPanel').classList.add('show');if(!meetings.length)await loadMeetings()};$('meetingSel').onchange=fillSessions;$('sessionSel').onchange=loadSelected;document.querySelectorAll('#gapToggle button').forEach(b=>b.onclick=()=>{gapMode=b.dataset.mode;document.querySelectorAll('#gapToggle button').forEach(x=>x.classList.toggle('active',x===b));if(latest)render(latest)});loadLatest();setInterval(()=>{if($('latestBtn').classList.contains('active'))loadLatest()},15000);
</script></body></html>
