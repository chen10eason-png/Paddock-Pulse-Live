<style>
:root{color-scheme:dark;--panel:#11151d;--muted:#8c95a6;--line:#242a35;--text:#f5f7fb;--purple:#bf5af2}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -15%,#1b2330 0,#0b0e14 38%,#080a0f 66%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;padding:env(safe-area-inset-top) 12px calc(24px + env(safe-area-inset-bottom))}.wrap{max-width:780px;margin:auto}.top{display:flex;justify-content:space-between;align-items:flex-start;padding:18px 4px 10px}.brand{font-weight:900;font-size:24px}.sub{font-size:12px;color:var(--muted);margin-top:3px}.badge{padding:7px 10px;border-radius:999px;font-size:12px;font-weight:850;background:#202631;color:#d9dee8}.badge.live{background:#421518;color:#ff817a}.badge.result{background:#172737;color:#a7d8ff}.badge.offline,.badge.waiting{background:#28292e;color:#aaa}.badge.stale,.badge.connecting{background:#31281a;color:#e3c486}.mode{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:4px 0 12px;background:#0d1118;border:1px solid var(--line);padding:4px;border-radius:14px}.mode button{border:0;font:inherit;padding:9px;border-radius:10px;background:transparent;color:#8f98a8;font-size:12px;font-weight:850}.mode button.active{background:#252b36;color:#fff}.historyPanel{display:none;margin-bottom:12px}.historyPanel.show{display:block}.selects{display:grid;grid-template-columns:1fr 1fr;gap:8px}.selects select{width:100%;background:#11151d;color:#fff;border:1px solid #242a35;border-radius:12px;padding:10px;font:inherit;font-size:12px}.hero{background:linear-gradient(180deg,rgba(24,30,41,.96),rgba(15,19,26,.96));border:1px solid #252b37;border-radius:23px;padding:18px}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.12em;color:#7d8797;margin-bottom:5px}.event{font-size:22px;font-weight:900}.meta{margin-top:5px;color:var(--muted);font-size:13px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.metric,.tiny{background:#0c1016;border:1px solid #202631;border-radius:16px;padding:13px}.metric b{display:block;font-size:20px;margin-top:4px}.label{font-size:10px;color:var(--muted);letter-spacing:.1em;font-weight:800}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.tiny{padding:10px;border-radius:14px}.tiny b{font-size:14px;display:block;margin-top:4px}.section{margin-top:18px}.sectionHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}.section h2{font-size:14px;margin:0;color:#c9cfda}.segmented{display:flex;padding:3px;background:#11151d;border:1px solid #242a35;border-radius:11px}.segmented button{border:0;background:transparent;color:#7f8999;padding:5px 10px;border-radius:8px;font-size:11px;font-weight:800}.segmented button.active{background:#252b36;color:#fff}.drivers,.rc{display:flex;flex-direction:column;gap:7px}.driver{position:relative;display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:10px;background:#11151d;border:1px solid var(--line);border-radius:15px;padding:11px 12px 11px 15px;overflow:hidden}.driver:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--team,#777)}.driver.retired{opacity:.56}.driver.fastest{box-shadow:inset 0 0 0 1px rgba(191,90,242,.46)}.driver.flash{animation:flash .7s ease-out}.pos{font-weight:950;font-size:18px}.name{font-weight:850}.team,.detail{font-size:11px;color:var(--muted);margin-top:3px}.right{text-align:right;min-width:110px}.gap{font-weight:820;font-size:13px}.best{font-weight:900;font-size:14px}.pill{display:inline-flex;border-radius:7px;padding:2px 5px;font-size:9px;font-weight:900;margin-left:5px}.dnf{background:#3a2224;color:#ff9a94}.fast{background:#321a42;color:#d9a0ff}.qparts{font-size:10px;color:#9ba4b4;margin-top:4px}.msg{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 12px}.footer{margin:18px 0 4px;text-align:center;color:#697284;font-size:11px}.empty{padding:22px;text-align:center;color:var(--muted);background:var(--panel);border-radius:16px;border:1px solid var(--line)}
.tyre{font-weight:900}
.tyre.soft{color:#ff5b61}
.tyre.medium{color:#ffd24a}
.tyre.hard{color:#f4f7fb}
.tyre.intermediate{color:#42d77d}
.tyre.wet{color:#4da3ff}
.tyreBadge{
  display:inline-flex;align-items:center;justify-content:center;
  width:19px;height:19px;margin-left:6px;border-radius:50%;
  font-size:10px;font-weight:950;line-height:1;vertical-align:1px
}
.tyreBadge.soft{background:#ff3545;color:#fff}
.tyreBadge.medium{background:#ffd21e;color:#111}
.tyreBadge.hard{background:#f4f6f8;color:#111}
.tyreBadge.intermediate{background:#36c768;color:#fff}
.tyreBadge.wet{background:#3494ff;color:#fff}
.metric.track-warning{border-color:#6c5b1f;background:#211d0e}
.metric.track-warning b{color:#ffd24a}
.metric.track-red{border-color:#74282d;background:#241114}
.metric.track-red b{color:#ff5f68}
.pit{color:#ffd24a!important;font-weight:950;letter-spacing:.04em}
.cheq{
  display:inline-block;width:16px;height:12px;margin-left:7px;vertical-align:-1px;
  background:conic-gradient(#fff 25%,#111 0 50%,#fff 0 75%,#111 0) 0 0/8px 8px;
  border:1px solid #dfe3e8;border-radius:1px
}
@keyframes flash{0%{background:#252b38}100%{background:#11151d}}@media(max-width:520px){.grid{grid-template-columns:repeat(2,1fr)}.metrics{grid-template-columns:1fr 1fr}.metric.clock{grid-column:1/-1}.driver{grid-template-columns:30px minmax(0,1fr) auto}.right{min-width:96px}.selects{grid-template-columns:1fr}}
</style></head><body><main class="wrap">
<div class="top"><div><div class="brand">Paddock Pulse Live</div><div class="sub">Race Tyre Timing Badge · V0.6.7</div></div><div id="status" class="badge">LOADING</div></div>
<div class="mode"><button id="latestBtn" class="active">最新狀態</button><button id="historyBtn">歷史結果</button></div>
<div id="historyPanel" class="historyPanel"><div class="selects"><select id="meetingSel"><option>載入賽事…</option></select><select id="sessionSel"><option>選擇 Session</option></select></div></div>
<section class="hero"><div id="eyebrow" class="eyebrow">LOADING</div><div id="event" class="event">等待資料…</div><div id="meta" class="meta">正在取得最新 session</div><div class="metrics"><div class="metric"><span class="label">LAP</span><b id="lap">—</b></div><div class="metric" id="trackMetric"><span class="label">TRACK</span><b id="track">—</b></div><div class="metric clock"><span class="label">SESSION CLOCK</span><b id="clock">—</b></div></div><div class="grid"><div class="tiny"><span class="label">AIR</span><b id="air">—</b></div><div class="tiny"><span class="label">TRACK TEMP</span><b id="ttrack">—</b></div><div class="tiny"><span class="label">HUMIDITY</span><b id="hum">—</b></div><div class="tiny"><span class="label">WIND</span><b id="wind">—</b></div></div></section>
<section class="section"><div class="sectionHead"><h2 id="towerTitle">Timing Tower</h2><div class="segmented" id="gapToggle"><button data-mode="gap" class="active">GAP</button><button data-mode="interval">INTERVAL</button></div></div><div id="drivers" class="drivers"><div class="empty">等待資料…</div></div></section>
<section class="section"><div class="sectionHead"><h2>Race Control</h2></div><div id="rc" class="rc"><div class="empty">目前沒有訊息</div></div></section><div id="updated" class="footer">—</div></main>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
let latest=null,gapMode='gap',meetings=[],pollTimer=null,requestInFlight=false,requestSeq=0,clockAnchor=null,lastClockRaw=null,lastClockSessionKey=null,lastBestByDriver=new Map(),lastQualPhase=1;

const LIVE_POLL_MS=5000;
const RACE_POLL_MS=3000;
const STALE_POLL_MS=8000;
const IDLE_POLL_MS=20000;
const ERROR_POLL_MS=10000;
const REQUEST_TIMEOUT_MS=7000;

function badge(s){s=String(s||'RESULT').toUpperCase();$('status').textContent=s;$('status').className='badge '+s.toLowerCase()}
function lapSeconds(s){if(!s)return Infinity;const p=String(s).split(':');return p.length===2?Number(p[0])*60+Number(p[1]):Number(s)||Infinity}
function fmtGap(sec){if(!Number.isFinite(sec))return'—';if(sec<0.0005)return'FASTEST';return'+'+sec.toFixed(3)}
function sessionKind(d){const s=((d.session?.Name||'')+' '+(d.session?.Type||'')).toLowerCase();if(s.includes('qualifying'))return'qualifying';if(s.includes('practice'))return'practice';if(s.includes('race')||s.includes('sprint'))return'race';return'other'}
function computedBest(ds){let n=null,t=Infinity;for(const d of ds||[]){const x=lapSeconds(d.bestLap);if(x<t){t=x;n=d.number}}return{number:n,time:t}}

function tyreClass(compound){
  const c=String(compound||'').toUpperCase();
  if(c==='SOFT')return'soft';
  if(c==='MEDIUM')return'medium';
  if(c==='HARD')return'hard';
  if(c==='INTERMEDIATE')return'intermediate';
  if(c==='WET')return'wet';
  return'';
}

function sessionEnded(d){
  const status=String(d?.status||'').toUpperCase();
  const ss=String(d?.sessionStatus||d?.session?.SessionStatus||'').toLowerCase();
  return d?.source==='archive'||status==='FINAL'||status==='RESULT'||
    ['finished','finalised','ended'].includes(ss);
}
function displayedCompound(d,x){
  const kind=sessionKind(d);
  if(kind==='practice'||kind==='qualifying'){
    return sessionEnded(d) ? (x.bestLapCompound||'') : (x.compound||'');
  }
  return x.compound||'';
}
function tyreLetter(compound){
  const c=String(compound||'').toUpperCase();
  if(c==='SOFT')return'S';
  if(c==='MEDIUM')return'M';
  if(c==='HARD')return'H';
  if(c==='INTERMEDIATE')return'I';
  if(c==='WET')return'W';
  return'';
}
function tyreBadgeMarkup(d,x){
  const compound=displayedCompound(d,x),letter=tyreLetter(compound);
  if(!compound||!letter)return'';
  return '<span class="tyreBadge '+tyreClass(compound)+'" title="'+esc(compound)+'">'+letter+'</span>';
}
function trackState(d){
  const code=String(d.track?.Status??'').trim();
  const raw=String(d.track?.Message||'').trim();
  if(code==='4')return{text:'SC',tone:'warning'};
  if(code==='6')return{text:'VSC',tone:'warning'};
  if(code==='7')return{text:'VSC ENDING',tone:'warning'};
  if(code==='5')return{text:'RED FLAG',tone:'red'};
  if(code==='2')return{text:raw||'YELLOW',tone:'warning'};
  return{text:raw||code||'—',tone:''};
}
function renderTrack(d){
  const state=trackState(d),metric=$('trackMetric');
  $('track').textContent=state.text;
  if(metric){
    metric.classList.remove('track-warning','track-red');
    if(state.tone==='warning')metric.classList.add('track-warning');
    if(state.tone==='red')metric.classList.add('track-red');
  }
}

function parseClockSeconds(v){
  if(!v)return null;
  const parts=String(v).trim().split(':').map(Number);
  if(parts.some(x=>!Number.isFinite(x)))return null;
  if(parts.length===3)return parts[0]*3600+parts[1]*60+parts[2];
  if(parts.length===2)return parts[0]*60+parts[1];
  if(parts.length===1)return parts[0];
  return null;
}
function formatClockSeconds(total){
  if(!Number.isFinite(total))return'—';
  total=Math.max(0,Math.floor(total));
  const h=Math.floor(total/3600),m=Math.floor(total%3600/60),s=total%60;
  return h>0?[h,m,s].map(x=>String(x).padStart(2,'0')).join(':'):[m,s].map(x=>String(x).padStart(2,'0')).join(':');
}
function sessionKey(d){
  const m=d?.session?.Meeting||{};
  return [m.Key||m.Name||'',d?.session?.Key||d?.session?.Name||'',sessionKind(d)].join('|');
}
function sessionClockShouldRun(d,seconds){
  if(d?.source!=='live'||!Number.isFinite(seconds)||seconds<=0)return false;
  const status=String(d.status||'').toUpperCase();
  const ss=String(d.sessionStatus||d.session?.SessionStatus||'').toLowerCase();
  if(status==='FINAL'||['finalised','finished','ended'].includes(ss))return false;

  // Respect an explicit pause from the official ExtrapolatedClock feed
  // (for example a stopped/red-flagged session).
  const flag=d.clock?.Extrapolating;
  if(flag===false||String(flag).toLowerCase()==='false')return false;

  const kind=sessionKind(d);
  return kind==='practice'||kind==='qualifying'||kind==='race';
}
function clockFeedUtc(d){
  const raw=d.clock?.Utc??d.clock?.UTC??d.clock?.utc;
  const ms=Date.parse(raw||'');
  return Number.isFinite(ms)?ms:null;
}
function setClockAnchor(d){
  const raw=d.clock?.Remaining;
  const seconds=parseClockSeconds(raw);
  const key=sessionKey(d);

  if(seconds==null){
    clockAnchor=null;
    lastClockRaw=null;
    lastClockSessionKey=key;
    return;
  }

  const now=Date.now();
  const rawText=String(raw);
  const feedUtc=clockFeedUtc(d);
  const utcKey=feedUtc==null?'':String(feedUtc);
  const fingerprint=rawText+'|'+utcKey;
  const sameSession=key===lastClockSessionKey;
  const sameRaw=fingerprint===lastClockRaw;
  const running=sessionClockShouldRun(d,seconds);

  if(clockAnchor&&sameSession&&sameRaw){
    clockAnchor.running=running;
    return;
  }

  // Key fix for refresh / app reopen:
  // ExtrapolatedClock.Remaining is an anchor value. When Utc is present,
  // first move that anchor forward to "now" instead of starting again
  // from the old Remaining value.
  let effective=seconds;
  if(running&&feedUtc!=null){
    const elapsed=Math.max(0,Math.min(6*3600,(now-feedUtc)/1000));
    effective=Math.max(0,seconds-elapsed);
  }

  clockAnchor={seconds:effective,at:now,running};
  lastClockRaw=fingerprint;
  lastClockSessionKey=key;
}
function tickClock(){
  if(!latest)return;
  if(!clockAnchor){$('clock').textContent=latest.clock?.Remaining||'—';return}
  const elapsed=clockAnchor.running?Math.floor((Date.now()-clockAnchor.at)/1000):0;
  $('clock').textContent=formatClockSeconds(clockAnchor.seconds-elapsed);
}
function qualifyingPhase(d){
  if(sessionKind(d)!=='qualifying')return null;
  let max=0;
  for(const x of d.drivers||[])max=Math.max(max,Array.isArray(x.qualTimes)?x.qualTimes.length:0);
  if(max>0)lastQualPhase=Math.max(1,Math.min(3,max));
  return lastQualPhase;
}
function qualifyingPhaseLabel(d){
  const p=qualifyingPhase(d);
  if(!p)return'';
  const sprint=/sprint/i.test((d.session?.Name||'')+' '+(d.session?.Type||''));
  return (sprint?'SQ':'Q')+p;
}

function changedBestNumbers(ds){
  const changed=new Set();
  for(const d of ds||[]){
    const n=String(d.number);
    const before=lastBestByDriver.get(n);
    if(before&&d.bestLap&&before!==d.bestLap)changed.add(n);
    if(d.bestLap)lastBestByDriver.set(n,d.bestLap);
  }
  return changed;
}

function render(d){
 latest=d;badge(d.status);$('eyebrow').textContent=d.source==='archive'?'LATEST / ARCHIVE RESULT':'LIVE TIMING';
 const m=d.session?.Meeting||{},phase=qualifyingPhaseLabel(d);$('event').textContent=m.Name||'F1 Session';$('meta').textContent=[m.Location,d.session?.Name,phase,d.sessionStatus||d.session?.SessionStatus].filter(Boolean).join(' · ');
 $('lap').textContent=(d.lap?.CurrentLap||'—')+' / '+(d.lap?.TotalLaps||'—');renderTrack(d);
 setClockAnchor(d);tickClock();
 $('air').textContent=d.weather?.AirTemp?d.weather.AirTemp+'°C':'—';$('ttrack').textContent=d.weather?.TrackTemp?d.weather.TrackTemp+'°C':'—';$('hum').textContent=d.weather?.Humidity?d.weather.Humidity+'%':'—';$('wind').textContent=d.weather?.WindSpeed?d.weather.WindSpeed+' m/s':'—';
 const ds=d.drivers||[],changed=changedBestNumbers(ds),kind=sessionKind(d),best=computedBest(ds),sessionAware=kind==='practice'||kind==='qualifying';
 $('towerTitle').textContent=sessionAware?(kind==='qualifying'?('Qualifying Times'+(phase?' · '+phase:'')):'Practice Times'):'Timing Tower';
 $('gapToggle').style.display=sessionAware?'none':'flex';
 $('drivers').innerHTML=ds.map(x=>{
   let right='',extra='';
   const state=x.retired?'<span class="pill dnf">DNF</span>':'';
   const fast=String(x.number)===String(best.number)&&x.bestLap?'<span class="pill fast">FASTEST</span>':'';
   if(sessionAware){
     const sec=lapSeconds(x.bestLap),computed=Number.isFinite(sec)&&Number.isFinite(best.time)?fmtGap(sec-best.time):'—';
     const gap=x.statsGap||computed;
     const interval=x.statsInterval||'';
     const q=x.qualTimes||[];
     right=`<div class="best">${esc(x.bestLap||'—')}${tyreBadgeMarkup(d,x)}</div><div class="detail">GAP ${esc(gap)}${interval?' · AHEAD '+esc(interval):''}</div>`;
     if(kind==='qualifying'&&q.length)extra=`<div class="qparts">${q.map((v,i)=>'Q'+(i+1)+' '+esc(v)).join(' · ')}</div>`;
   }else{
     const v=gapMode==='interval'?(x.position===1?'LEADER':x.interval||'—'):(x.position===1?'LEADER':x.gap||'—');
     right=x.inPit
       ? `<div class="gap pit">IN PIT${tyreBadgeMarkup(d,x)}</div><div class="detail">${x.lastLap?'LAST '+esc(x.lastLap):'LAST —'}${x.bestLap?' · BEST '+esc(x.bestLap):''}</div>`
       : `<div class="gap">${esc(v)}${tyreBadgeMarkup(d,x)}</div><div class="detail">${x.lastLap?'LAST '+esc(x.lastLap):'LAST —'}${x.bestLap?' · BEST '+esc(x.bestLap):''}</div>`;
   }
   return `<div class="driver ${x.retired?'retired ':''}${String(x.number)===String(best.number)&&x.bestLap?'fastest ':''}${changed.has(String(x.number))?'flash':''}" style="--team:#${esc(x.teamColour||'777777')}"><div class="pos">${esc(x.position)}</div><div><div class="name">${esc(x.tla||x.name||x.number)} #${esc(x.number)}${x.chequered?'<span class="cheq" title="Chequered" aria-label="Chequered"></span>':''}${state}${fast}</div><div class="team">${esc(x.team)}${sessionAware&&x.laps!=null?' · '+esc(x.laps)+' LAPS':''}</div>${extra}</div><div class="right">${right}</div></div>`
 }).join('')||'<div class="empty">目前沒有車手資料</div>';
 $('rc').innerHTML=(d.raceControl||[]).slice(0,14).map(x=>`<div class="msg"><strong>${esc(x.Flag||x.Category||'Race Control')}${x.Lap?' · LAP '+esc(x.Lap):''}</strong><div class="detail">${esc(x.Message||'')}</div></div>`).join('')||'<div class="empty">目前沒有 Race Control 訊息</div>';
 $('updated').textContent=d.source==='archive'?'資料來源：F1 Live Timing Archive':'最後 Live Timing 更新：'+(d.lastTimingAt?new Date(d.lastTimingAt).toLocaleString('zh-TW'):'—')
}

async function j(url){
 const controller=new AbortController();
 const timeout=setTimeout(()=>controller.abort(),REQUEST_TIMEOUT_MS);
 try{
   const r=await fetch(url,{cache:'no-store',signal:controller.signal});
   if(!r.ok)throw Error(await r.text());
   return await r.json()
 } finally{clearTimeout(timeout)}
}

function archiveComplete(d){return String(d?.session?.ArchiveStatus?.Status||'').toLowerCase()==='complete';}
function liveStillUsable(d){
  if(d.status==='LIVE')return true;
  if(!Array.isArray(d.drivers)||!d.drivers.length)return false;
  const kind=sessionKind(d);
  if(kind==='qualifying'||kind==='practice'){
    const age=Date.now()-Date.parse(d.lastMessageAt||d.lastTimingAt||0);
    if(Number.isFinite(age)&&age<30*60*1000)return true;
  }
  if(d.status==='STALE'&&d.lastTimingAt){
    const age=Date.now()-Date.parse(d.lastTimingAt);
    return Number.isFinite(age)&&age<90000;
  }
  return d.status==='CONNECTING';
}
function normalizedSessionName(d){return String(d?.session?.Name||d?.session?.Type||'').toLowerCase().replace(/\s+/g,' ').trim();}
function normalizedMeetingName(d){const m=d?.session?.Meeting||{};return String(m.Key||m.Name||m.OfficialName||'').toLowerCase().replace(/\s+/g,' ').trim();}
function sameSession(a,b){
  const an=normalizedSessionName(a),bn=normalizedSessionName(b);
  if(!an||!bn||an!==bn)return false;
  const am=normalizedMeetingName(a),bm=normalizedMeetingName(b);
  return !am||!bm||am===bm;
}

function nextDelay(d,failed=false){
  if(failed)return ERROR_POLL_MS;
  if(d?.source==='live'&&d.status==='LIVE')return sessionKind(d)==='race'?RACE_POLL_MS:LIVE_POLL_MS;
  if(d?.source==='live'&&(d.status==='STALE'||d.status==='CONNECTING'))return STALE_POLL_MS;
  return IDLE_POLL_MS;
}

function schedulePoll(ms){
  clearTimeout(pollTimer);
  if(!$('latestBtn').classList.contains('active'))return;
  pollTimer=setTimeout(()=>loadLatest(true),ms);
}

async function loadLatest(fromPoll=false){
  if(requestInFlight){
    if(fromPoll)schedulePoll(2000);
    return;
  }
  requestInFlight=true;
  const seq=++requestSeq;
  let rendered=null,failed=false;
  try{
    const live=await j('/api/live');
    if(seq!==requestSeq)return;
    if(liveStillUsable(live)){
      render(live);rendered=live;
    }else{
      const archived=await j('/api/archive/latest');
      if(seq!==requestSeq)return;
      const liveHasRows=Array.isArray(live.drivers)&&live.drivers.length>0;
      const liveKind=sessionKind(live);
      if(sameSession(live,archived)||!liveHasRows||liveKind==='other'||archiveComplete(live)){
        render(archived);rendered=archived;
      }else{
        render(live);rendered=live;
      }
    }
  }catch(e){
    failed=true;
    try{
      const live=await j('/api/live');
      if(seq===requestSeq){render(live);rendered=live}
    }catch(_){
      if(seq===requestSeq){badge('OFFLINE');$('meta').textContent='無法取得 Live 或 Archive 資料'}
    }
  }finally{
    if(seq===requestSeq){
      requestInFlight=false;
      schedulePoll(nextDelay(rendered,failed));
    }
  }
}

async function loadMeetings(){const d=await j('/api/archive/meetings');meetings=d.meetings||[];$('meetingSel').innerHTML=meetings.map((m,i)=>`<option value="${i}">${esc(m.Name)}</option>`).join('');if(meetings.length){$('meetingSel').value=String(meetings.length-1);fillSessions()}}
function fillSessions(){const m=meetings[Number($('meetingSel').value)];$('sessionSel').innerHTML=(m?.Sessions||[]).map((s,i)=>`<option value="${i}">${esc(s.Name||s.Type)}</option>`).join('');if(m?.Sessions?.length){$('sessionSel').value=String(m.Sessions.length-1);loadSelected()}}
async function loadSelected(){const m=meetings[Number($('meetingSel').value)],s=m?.Sessions?.[Number($('sessionSel').value)];if(!s)return;badge('LOADING');render(await j('/api/archive/session?path='+encodeURIComponent(s.Path)))}

$('latestBtn').onclick=()=>{requestSeq++;requestInFlight=false;clearTimeout(pollTimer);$('latestBtn').classList.add('active');$('historyBtn').classList.remove('active');$('historyPanel').classList.remove('show');loadLatest()};
$('historyBtn').onclick=async()=>{requestSeq++;requestInFlight=false;clearTimeout(pollTimer);$('historyBtn').classList.add('active');$('latestBtn').classList.remove('active');$('historyPanel').classList.add('show');if(!meetings.length)await loadMeetings()};
$('meetingSel').onchange=fillSessions;$('sessionSel').onchange=loadSelected;
document.querySelectorAll('#gapToggle button').forEach(b=>b.onclick=()=>{gapMode=b.dataset.mode;document.querySelectorAll('#gapToggle button').forEach(x=>x.classList.toggle('active',x===b));if(latest)render(latest)});

setInterval(tickClock,1000);
loadLatest();
</script></body></html>
