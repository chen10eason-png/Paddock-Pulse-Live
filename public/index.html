<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080a0f"><title>Paddock Pulse Live</title>
<style>
:root{color-scheme:dark;--bg:#080a0f;--panel:#11151d;--muted:#8c95a6;--line:#242a35;--text:#f5f7fb;--red:#ff453a;--green:#30d158;--amber:#ffd60a;--blue:#64d2ff;--purple:#bf5af2}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -15%,#1b2330 0,#0b0e14 38%,#080a0f 66%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;padding:env(safe-area-inset-top) 12px calc(24px + env(safe-area-inset-bottom))}.wrap{max-width:780px;margin:auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:18px 4px 12px}.brand{font-weight:900;letter-spacing:-.045em;font-size:24px}.sub{font-size:12px;color:var(--muted);margin-top:3px}.badge{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;font-size:12px;font-weight:850;background:#202631;color:#d9dee8}.badge.live{background:#421518;color:#ff817a}.badge.final{background:#172737;color:#a7d8ff}.badge.stale{background:#37290f;color:#ffd27c}.badge.offline{background:#28292e;color:#aaa}.badge.demo{background:#2d2138;color:#dab7ff}.hero{background:linear-gradient(180deg,rgba(24,30,41,.96),rgba(15,19,26,.96));border:1px solid #252b37;border-radius:23px;padding:18px}.event{font-size:22px;font-weight:900}.meta{margin-top:5px;color:var(--muted);font-size:13px}.alert{display:none;margin-top:12px;border-radius:14px;padding:10px 12px;font-weight:900;font-size:12px}.alert.show{display:block}.alert.yellow,.alert.vsc,.alert.sc{background:#493b09;color:#ffe171}.alert.red{background:#451416;color:#ff8a83}.alert.green{background:#113720;color:#80e7a1}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.metric,.tiny{background:#0c1016;border:1px solid #202631;border-radius:16px;padding:13px}.metric b{display:block;font-size:20px;margin-top:4px}.label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:800}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.tiny{padding:10px;border-radius:14px}.tiny b{font-size:14px;display:block;margin-top:4px}.health{margin-top:12px;background:#0c1016;border:1px solid #202631;border-radius:14px;padding:10px 12px;display:flex;justify-content:space-between;color:#7f8999;font-size:11px}.section{margin-top:18px}.sectionHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}.section h2{font-size:14px;margin:0;color:#c9cfda}.segmented{display:flex;padding:3px;background:#11151d;border:1px solid #242a35;border-radius:11px}.segmented button{border:0;background:transparent;color:#7f8999;padding:5px 10px;border-radius:8px;font-size:11px;font-weight:800}.segmented button.active{background:#252b36;color:#fff}.drivers,.rc{display:flex;flex-direction:column;gap:7px}.driver{position:relative;display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;background:#11151d;border:1px solid var(--line);border-radius:15px;padding:11px 12px 11px 15px;overflow:hidden}.driver:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--team,#777)}.driver.retired{opacity:.56}.pos{font-weight:950;font-size:18px}.name{font-weight:850}.team,.detail{font-size:11px;color:var(--muted);margin-top:3px}.right{text-align:right}.gap{font-weight:820;font-size:13px}.pill{display:inline-flex;border-radius:7px;padding:2px 5px;font-size:9px;font-weight:900;margin-left:5px}.dnf{background:#3a2224;color:#ff9a94}.stop{background:#44340d;color:#ffd76b}.pit{background:#4b370c;color:#ffd76b}.fast{background:#321a42;color:#d9a0ff}.msg{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 12px}.footer{margin:18px 0 4px;text-align:center;color:#697284;font-size:11px}.empty{padding:22px;text-align:center;color:var(--muted);background:var(--panel);border-radius:16px;border:1px solid var(--line)}
@media(max-width:520px){.grid{grid-template-columns:repeat(2,1fr)}.metrics{grid-template-columns:1fr 1fr}.metric.clock{grid-column:1/-1}.driver{grid-template-columns:30px 1fr auto}}
</style></head><body><main class="wrap">
<div class="top"><div><div class="brand">Paddock Pulse Live</div><div class="sub">F1 Live Timing · V0.5</div></div><div id="status" class="badge">CONNECTING</div></div>
<section class="hero"><div id="event" class="event">等待 F1 Timing…</div><div id="meta" class="meta">正在連線</div><div id="alert" class="alert"></div><div class="metrics"><div class="metric"><span class="label">LAP</span><b id="lap">—</b></div><div class="metric"><span class="label">TRACK</span><b id="track">—</b></div><div class="metric clock"><span class="label">SESSION CLOCK</span><b id="clock">—</b></div></div><div class="grid"><div class="tiny"><span class="label">AIR</span><b id="air">—</b></div><div class="tiny"><span class="label">TRACK TEMP</span><b id="ttrack">—</b></div><div class="tiny"><span class="label">HUMIDITY</span><b id="hum">—</b></div><div class="tiny"><span class="label">WIND</span><b id="wind">—</b></div></div><div class="health"><span>Timing age</span><strong id="age">—</strong></div></section>
<section class="section"><div class="sectionHead"><h2>Timing Tower</h2><div class="segmented" id="gapToggle"><button data-mode="gap" class="active">GAP</button><button data-mode="interval">INTERVAL</button></div></div><div id="drivers" class="drivers"><div class="empty">等待資料…</div></div></section>
<section class="section"><div class="sectionHead"><h2>Race Control</h2></div><div id="rc" class="rc"><div class="empty">目前沒有訊息</div></div></section><div id="updated" class="footer">—</div></main>
<script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));let latest=null,gapMode='gap';
function badge(s){s=String(s||'OFFLINE').toUpperCase();$('status').textContent=s;$('status').className='badge '+s.toLowerCase()}
function lapSeconds(s){if(!s)return Infinity;const p=String(s).split(':');return p.length===2?Number(p[0])*60+Number(p[1]):Number(s)||Infinity}
function fastestNumber(ds){let b=null,t=Infinity;for(const d of ds||[]){const x=lapSeconds(d.bestLap);if(x<t){t=x;b=d.number}}return b}
function alertState(t){const s=((t?.Message||'')+' '+(t?.Status||'')).toUpperCase(),e=$('alert');let c='',l='';if(s.includes('RED')){c='red';l='RED FLAG'}else if(s.includes('VSC')||s.includes('VIRTUAL')){c='vsc';l='VIRTUAL SAFETY CAR'}else if(s.includes('SAFETY CAR')||/\bSC\b/.test(s)){c='sc';l='SAFETY CAR'}else if(s.includes('YELLOW')){c='yellow';l='YELLOW FLAG'}else if(s.includes('GREEN')){c='green';l='TRACK GREEN'}e.className='alert'+(c?' show '+c:'');e.textContent=l}
function fmtAge(i){if(!i)return'—';const s=Math.max(0,Math.floor((Date.now()-Date.parse(i))/1000));return s<60?s+' 秒':Math.floor(s/60)+' 分 '+s%60+' 秒'}
function render(d){latest=d;badge(d.status);alertState(d.track);const m=d.session?.Meeting||{},ss=d.sessionStatus||d.session?.SessionStatus||'';$('event').textContent=m.Name||'F1 Live Timing';$('meta').textContent=[m.Location,d.session?.Name,ss].filter(Boolean).join(' · ')||'等待 session';$('lap').textContent=(d.lap?.CurrentLap||'—')+' / '+(d.lap?.TotalLaps||'—');$('track').textContent=d.track?.Message||d.track?.Status||'—';$('clock').textContent=d.clock?.Remaining||'—';$('air').textContent=d.weather?.AirTemp?d.weather.AirTemp+'°C':'—';$('ttrack').textContent=d.weather?.TrackTemp?d.weather.TrackTemp+'°C':'—';$('hum').textContent=d.weather?.Humidity?d.weather.Humidity+'%':'—';$('wind').textContent=d.weather?.WindSpeed?d.weather.WindSpeed+' m/s':'—';$('age').textContent=fmtAge(d.lastTimingAt);
const ds=d.drivers||[],fast=fastestNumber(ds);$('drivers').innerHTML=ds.map(x=>{const v=gapMode==='interval'?(x.position===1?'LEADER':x.interval||'—'):(x.position===1?'LEADER':x.gap||'—');const state=x.retired?'<span class="pill dnf">DNF</span>':x.stopped?'<span class="pill stop">STOP</span>':x.inPit?'<span class="pill pit">PIT</span>':'';const f=String(x.number)===String(fast)&&x.bestLap?'<span class="pill fast">FASTEST</span>':'';return `<div class="driver ${x.retired?'retired':''}" style="--team:#${esc(x.teamColour||'777777')}"><div class="pos">${esc(x.position)}</div><div><div class="name">${esc(x.tla||x.name||x.number)} #${esc(x.number)}${state}${f}</div><div class="team">${esc(x.team)} · ${esc(x.compound||'—')} ${x.tyreLaps!=null?esc(x.tyreLaps)+'L':''}${x.pitStops!=null?' · '+esc(x.pitStops)+' STOP':''}</div></div><div class="right"><div class="gap">${esc(v)}</div><div class="detail">${x.lastLap?'LAST '+esc(x.lastLap):'LAST —'}${x.bestLap?' · BEST '+esc(x.bestLap):''}</div></div></div>`}).join('')||'<div class="empty">目前沒有車手資料</div>';
$('rc').innerHTML=(d.raceControl||[]).slice(0,14).map(x=>`<div class="msg"><strong>${esc(x.Flag||x.Category||'Race Control')}${x.Lap?' · LAP '+esc(x.Lap):''}</strong><div class="detail">${esc(x.Message||'')}</div></div>`).join('')||'<div class="empty">目前沒有 Race Control 訊息</div>';$('updated').textContent='最後 Timing 更新：'+(d.lastTimingAt?new Date(d.lastTimingAt).toLocaleString('zh-TW'):'—')}
document.querySelectorAll('#gapToggle button').forEach(b=>b.onclick=()=>{gapMode=b.dataset.mode;document.querySelectorAll('#gapToggle button').forEach(x=>x.classList.toggle('active',x===b));if(latest)render(latest)});
async function load(){try{const r=await fetch('/api/live',{cache:'no-store'});if(!r.ok)throw Error(r.status);render(await r.json())}catch(e){badge('OFFLINE');$('meta').textContent='無法取得 Live API'}}load();setInterval(load,2000);setInterval(()=>{if(latest)$('age').textContent=fmtAge(latest.lastTimingAt)},1000);
</script></body></html>
